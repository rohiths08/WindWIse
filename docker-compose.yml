services:
  backend:
    image: windwise-backend:local
    build:
      context: ./backend
    ports:
      - "8000:8000"
  frontend:
    image: windwise-frontend:local
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
